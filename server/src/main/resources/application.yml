server:
  port: 8080

spring:
  application:
    name: jarvis-server
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/jarvis?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # Match record/constructor parameters to columns by name (not position), so that
    # extra columns like user_id in SELECT * are ignored instead of mis-bound.
    arg-name-based-constructor-auto-mapping: true

jarvis:
  auth:
    # Dev bypass ON: local runs need no login (JwtAuthFilter injects the "local" user when
    # no valid token is present). Turn OFF in prod so protected /api/** returns 401.
    dev-bypass: ${JARVIS_AUTH_DEV_BYPASS:true}
    # JWT signing secret — MUST be overridden in prod (env JWT_SECRET). Blank -> dev default.
    jwt-secret: ${JWT_SECRET:}
    # Registration invite code — blank means open registration (env INVITE_CODE).
    invite-code: ${INVITE_CODE:}

logging:
  level:
    com.jarvis: DEBUG
