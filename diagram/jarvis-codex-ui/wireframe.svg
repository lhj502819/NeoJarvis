<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .ui { font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="winshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#8a8578" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ═══ canvas ═══ -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="30" y="40" fill="#ffffff" font-size="16" font-weight="700">Jarvis UI 改版 · Codex 布局线框图</text>
  <text x="30" y="58" fill="#94a3b8" font-size="9">web/src 视图重排 — 浅色默认 · 对话流居中 · 侧栏 Codex 化 · 数据层 / SSE / A2A 流程零改动</text>

  <!-- ═══ app window ═══ -->
  <rect x="30" y="76" width="1080" height="890" rx="14" fill="#ffffff" stroke="rgba(255,255,255,0.16)" filter="url(#winshadow)"/>

  <!-- sidebar -->
  <rect x="30" y="76" width="250" height="890" rx="14" fill="#f7f6f3"/>
  <rect x="266" y="76" width="14" height="890" fill="#f7f6f3"/>
  <line x1="280.5" y1="76" x2="280.5" y2="966" stroke="#ebe9e4"/>

  <!-- traffic lights -->
  <circle cx="52" cy="102" r="6" fill="#ff5f57"/>
  <circle cx="74" cy="102" r="6" fill="#febc2e"/>
  <circle cx="96" cy="102" r="6" fill="#28c840"/>
  <!-- sidebar toggle -->
  <g transform="translate(118,95)" stroke="#8a8a86" fill="none" stroke-width="1.4">
    <rect x="0" y="0" width="17" height="14" rx="3"/>
    <line x1="6" y1="0" x2="6" y2="14"/>
  </g>

  <!-- sidebar nav: top actions -->
  <g class="ui">
    <!-- 新任务 -->
    <rect x="46" y="132" width="216" height="34" rx="8" fill="#ecebe7"/>
    <g transform="translate(60,141)" stroke="#3a3a37" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
      <path d="M18 1.5l3.5 3.5L12 14.5H8.5V11z"/>
    </g>
    <text x="88" y="154" fill="#1a1a1a" font-size="12.5" font-weight="500">新任务</text>
    <!-- 搜索 -->
    <g transform="translate(60,179)" stroke="#3a3a37" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="7" cy="7" r="5.5"/><line x1="11.5" y1="11.5" x2="15" y2="15"/>
    </g>
    <text x="88" y="192" fill="#3a3a37" font-size="12.5">搜索</text>
    <!-- 插件 -->
    <g transform="translate(60,217)" fill="#3a3a37">
