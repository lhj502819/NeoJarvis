      <circle cx="3" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/>
    </g>
    <text x="88" y="230" fill="#3a3a37" font-size="12.5">插件</text>
    <!-- 定时任务 -->
    <g transform="translate(60,255)" stroke="#3a3a37" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="7.5" cy="7.5" r="6.5"/><path d="M7.5 3.5v4.5l3 2"/>
    </g>
    <text x="88" y="268" fill="#3a3a37" font-size="12.5">定时任务</text>

    <!-- section 工作台 -->
    <text x="48" y="318" fill="#9a9994" font-size="11" font-weight="500">工作台 ˅</text>
    <g transform="translate(60,330)" stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linejoin="round">
      <path d="M1 4a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/>
    </g>
    <text x="88" y="342" fill="#3a3a37" font-size="12.5">团队</text>
    <g transform="translate(60,368)" stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linejoin="round">
      <path d="M1 4a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/>
    </g>
    <text x="88" y="380" fill="#3a3a37" font-size="12.5">制品库</text>
    <g transform="translate(60,406)" stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linejoin="round">
      <path d="M1 4a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/>
    </g>
    <text x="88" y="418" fill="#3a3a37" font-size="12.5">技能</text>

    <text x="48" y="472" fill="#9a9994" font-size="11" font-weight="500">对话 ›</text>
    <rect x="48" y="486" width="160" height="8" rx="4" fill="#e5e4df"/>
    <rect x="48" y="504" width="118" height="8" rx="4" fill="#e5e4df"/>
  </g>

  <!-- sidebar bottom user -->
  <line x1="30.5" y1="900" x2="280" y2="900" stroke="#ebe9e4"/>
  <circle cx="64" cy="930" r="13" fill="#d8d6d0"/>
  <text x="64" y="934.5" fill="#5a5852" font-size="10.5" font-weight="600" text-anchor="middle">李</text>
  <text x="86" y="934.5" fill="#1a1a1a" font-size="12" font-weight="500">李宏健</text>
  <g transform="translate(246,923)" stroke="#6b6a66" fill="none" stroke-width="1.4">
    <circle cx="7" cy="7" r="3"/>
    <path d="M7 1.5v2M7 10.5v2M1.5 7h2M10.5 7h2M3.2 3.2l1.4 1.4M9.4 9.4l1.3 1.3M10.8 3.2L9.4 4.6M4.6 9.4l-1.4 1.4"/>
  </g>

  <!-- top bar -->
  <text x="306" y="108" fill="#1a1a1a" font-size="13.5" font-weight="600">新对话</text>
  <circle cx="366" cy="103" r="4" fill="#30a46c"/>
  <g stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(996,95)">
      <path d="M11 3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
      <path d="M18 1.5l3.5 3.5L12 14.5H8.5V11z"/>
    </g>
    <circle cx="1035" cy="103" r="10" fill="#d8d6d0"/>
    <text x="1035" y="107" fill="#5a5852" font-size="9.5" font-weight="600" text-anchor="middle" stroke="none">李</text>
    <g transform="translate(1054,96)">
