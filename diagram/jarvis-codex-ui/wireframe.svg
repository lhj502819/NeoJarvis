  <rect x="420" y="176" width="540" height="10" rx="5" fill="#e9e8e4"/>
  <rect x="420" y="200" width="500" height="10" rx="5" fill="#e9e8e4"/>
  <rect x="420" y="224" width="430" height="10" rx="5" fill="#e9e8e4"/>

  <!-- user bubble right-aligned gray pill -->
  <rect x="660" y="262" width="320" height="42" rx="21" fill="#f2f1ee"/>
  <text x="682" y="288" fill="#1a1a1a" font-size="12">我还原了 SKILL,你看下最新的</text>

  <!-- processed collapsed row -->
  <text x="420" y="352" fill="#9a9994" font-size="12">已处理 2分钟 33秒</text>
  <path d="M564 342 l5 5 -5 5" stroke="#9a9994" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="420" y1="374" x2="980" y2="374" stroke="#f0efeb"/>

  <!-- assistant response -->
  <rect x="420" y="398" width="300" height="12" rx="6" fill="#dcdbd6"/>
  <circle cx="428" cy="430" r="2.5" fill="#b8b7b2"/>
  <rect x="440" y="425" width="380" height="9" rx="4.5" fill="#e9e8e4"/>
  <circle cx="428" cy="454" r="2.5" fill="#b8b7b2"/>
  <rect x="440" y="449" width="420" height="9" rx="4.5" fill="#e9e8e4"/>
  <circle cx="428" cy="478" r="2.5" fill="#b8b7b2"/>
  <rect x="440" y="473" width="300" height="9" rx="4.5" fill="#e9e8e4"/>
  <rect x="440" y="494" width="64" height="20" rx="6" fill="#f2f1ee"/>
  <text x="472" y="508" fill="#1a1a1a" font-size="10" text-anchor="middle">2.9.0</text>
  <rect x="512" y="494" width="64" height="20" rx="6" fill="#f2f1ee"/>
  <text x="544" y="508" fill="#1a1a1a" font-size="10" text-anchor="middle">2.9.1</text>
  <rect x="420" y="534" width="480" height="10" rx="5" fill="#e9e8e4"/>

  <!-- suggestion chips -->
  <text x="420" y="628" fill="#9a9994" font-size="11">✦ 接下来</text>
  <rect x="486" y="610" width="86" height="32" rx="16" fill="#ffffff" stroke="#e4e2dd"/>
  <text x="529" y="630.5" fill="#1a1a1a" font-size="11.5" text-anchor="middle">继续执行</text>
  <rect x="580" y="610" width="146" height="32" rx="16" fill="#ffffff" stroke="#e4e2dd"/>
  <text x="653" y="630.5" fill="#1a1a1a" font-size="11.5" text-anchor="middle">好的,按推荐进行</text>

  <!-- scroll to bottom -->
  <circle cx="700" cy="690" r="15" fill="#ffffff" stroke="#e4e2dd"/>
  <path d="M700 683v13M695 691l5 5 5-5" stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══ input card ═══ -->
  <rect x="420" y="796" width="560" height="134" rx="16" fill="#ffffff" stroke="#e4e2dd" filter="url(#cardshadow)"/>
  <text x="444" y="830" fill="#b3b1ac" font-size="13">随心输入</text>
  <g transform="translate(940,812)" stroke="#b3b1ac" fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M0 5V1.5A1.5 1.5 0 0 1 1.5 0H5M11 0h3.5A1.5 1.5 0 0 1 16 1.5V5M16 11v3.5a1.5 1.5 0 0 1-1.5 1.5H11M5 16H1.5A1.5 1.5 0 0 1 0 14.5V11"/>
  </g>
  <line x1="420" y1="866" x2="980" y2="866" stroke="#f0efeb"/>
  <circle cx="448" cy="898" r="11" fill="none" stroke="#b3b1ac" stroke-width="1.4"/>
  <path d="M448 893v10M443 898h10" stroke="#b3b1ac" stroke-width="1.4" stroke-linecap="round"/>
  <g transform="translate(478,890)" stroke="#6b6a66" fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M8 1L3 6a3.5 3.5 0 0 0 5 5l6-6a2.3 2.3 0 0 0-3.3-3.3L5 7.5a1.2 1.2 0 0 0 1.7 1.7L11 5"/>
  </g>
  <text x="512" y="902" fill="#d97a2b" font-size="11.5" font-weight="500">⚠ 完全访问 ˅</text>
  <path d="M886 890a7 7 0 0 1 7 7" stroke="#d97a2b" fill="none" stroke-width="1.6" stroke-linecap="round"/>
  <text x="902" y="902" fill="#6b6a66" font-size="11.5">DeepSeek-V4.1 · 中 ˅</text>
  <circle cx="950" cy="898" r="14" fill="#1a1a1a"/>
  <path d="M950 904v-11M945.5 897l4.5-4.5 4.5 4.5" stroke="#ffffff" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══ numbered badges on mockup ═══ -->
  <g font-size="10" font-weight="700">
    <circle cx="980" cy="102" r="11" fill="#22d3ee"/><text x="980" y="106" fill="#0f172a" text-anchor="middle">1</text>
    <circle cx="402" cy="200" r="11" fill="#22d3ee"/><text x="402" y="204" fill="#0f172a" text-anchor="middle">2</text>
    <circle cx="402" cy="348" r="11" fill="#22d3ee"/><text x="402" y="352" fill="#0f172a" text-anchor="middle">3</text>
    <circle cx="402" cy="626" r="11" fill="#22d3ee"/><text x="402" y="630" fill="#0f172a" text-anchor="middle">4</text>
    <circle cx="402" cy="812" r="11" fill="#22d3ee"/><text x="402" y="816" fill="#0f172a" text-anchor="middle">5</text>
    <circle cx="254" cy="292" r="11" fill="#22d3ee"/><text x="254" y="296" fill="#0f172a" text-anchor="middle">6</text>
    <circle cx="1088" cy="948" r="11" fill="#22d3ee"/><text x="1088" y="952" fill="#0f172a" text-anchor="middle">7</text>
  </g>

  <!-- ═══ right legend ═══ -->
  <text x="1150" y="112" fill="#ffffff" font-size="13" font-weight="700">改动映射(8 处)</text>
  <g font-size="10" font-weight="700">
    <circle cx="1158" cy="140" r="11" fill="#22d3ee"/><text x="1158" y="144" fill="#0f172a" text-anchor="middle">1</text>
    <circle cx="1158" cy="228" r="11" fill="#22d3ee"/><text x="1158" y="232" fill="#0f172a" text-anchor="middle">2</text>
    <circle cx="1158" cy="316" r="11" fill="#22d3ee"/><text x="1158" y="320" fill="#0f172a" text-anchor="middle">3</text>
    <circle cx="1158" cy="404" r="11" fill="#22d3ee"/><text x="1158" y="408" fill="#0f172a" text-anchor="middle">4</text>
    <circle cx="1158" cy="492" r="11" fill="#22d3ee"/><text x="1158" y="496" fill="#0f172a" text-anchor="middle">5</text>
    <circle cx="1158" cy="580" r="11" fill="#22d3ee"/><text x="1158" y="584" fill="#0f172a" text-anchor="middle">6</text>
    <circle cx="1158" cy="668" r="11" fill="#22d3ee"/><text x="1158" y="672" fill="#0f172a" text-anchor="middle">7</text>
    <circle cx="1158" cy="756" r="11" fill="#22d3ee"/><text x="1158" y="760" fill="#0f172a" text-anchor="middle">8</text>
  </g>
  <g class="ui">
    <text x="1180" y="138" fill="#ffffff" font-size="11.5" font-weight="600">顶栏替代 Aurora 状态条</text>
    <text x="1180" y="156" fill="#94a3b8" font-size="9.5">会话标题 + 状态点;右侧 = 监控开关 / 清空入口</text>
    <text x="1180" y="226" fill="#ffffff" font-size="11.5" font-weight="600">对话流居中 820px</text>
    <text x="1180" y="244" fill="#94a3b8" font-size="9.5">Jarvis 无气泡纯文本;user 右侧灰泡(去头像)</text>
    <text x="1180" y="314" fill="#ffffff" font-size="11.5" font-weight="600">「已处理 Ns」折叠行</text>
    <text x="1180" y="332" fill="#94a3b8" font-size="9.5">思考指示收敛为灰字 + 计时,风格对齐</text>
    <text x="1180" y="402" fill="#ffffff" font-size="11.5" font-weight="600">推荐 chips</text>
    <text x="1180" y="420" fill="#94a3b8" font-size="9.5">回复后给「继续」类快捷追问,点击即发送</text>
    <text x="1180" y="490" fill="#ffffff" font-size="11.5" font-weight="600">输入卡片重绘</text>
    <text x="1180" y="508" fill="#94a3b8" font-size="9.5">去 HUD 角标;+ 附图 / 模型徽标 / 黑色发送钮</text>
    <text x="1180" y="578" fill="#ffffff" font-size="11.5" font-weight="600">侧栏 Codex 化</text>
    <text x="1180" y="596" fill="#94a3b8" font-size="9.5">新任务/搜索/插件/定时任务 + 工作台分区 + 底部用户</text>
    <text x="1180" y="666" fill="#ffffff" font-size="11.5" font-weight="600">浅色为默认主题</text>
    <text x="1180" y="684" fill="#94a3b8" font-size="9.5">白底中性灰黑字;深色主题保留,可切回</text>
    <text x="1180" y="754" fill="#ffffff" font-size="11.5" font-weight="600">监控面板 → 抽屉</text>
    <text x="1180" y="772" fill="#94a3b8" font-size="9.5">MonitorPanel 默认收起,顶栏开关唤出,功能不变</text>
  </g>
  <rect x="1150" y="810" width="360" height="64" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="1166" y="834" fill="#fbbf24" font-size="9.5" font-weight="600">保持不变</text>
  <text x="1166" y="852" fill="#94a3b8" font-size="9">数据层 / SSE 事件 / A2A 派单 / 制品 / 登录鉴权 —</text>
  <text x="1166" y="866" fill="#94a3b8" font-size="9">仅视图与样式重排,接口调用一律不动</text>
